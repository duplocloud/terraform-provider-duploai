run:
  timeout: 5m

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

linters-settings:
  goimports:
    local-prefixes: github.com/duplocloud/terraform-provider-duploai

issues:
  # Show all issues (the CI action additionally filters to new ones on PRs).
  max-issues-per-linter: 0
  max-same-issues: 0
