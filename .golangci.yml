version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/duplocloud/terraform-provider-duploai

linters:
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

issues:
  # Show all issues (the CI action additionally filters to new ones on PRs).
  max-issues-per-linter: 0
  max-same-issues: 0
