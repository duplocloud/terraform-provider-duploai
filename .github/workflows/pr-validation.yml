name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - develop
      - release/**
      - hotfix/**

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate PR Description
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            let prTitle = context.payload.pull_request.title || '';

            // Strip ClickUp ID from title if present and update via API
            const titleClickupMatch = prTitle.match(/DUPLOAI-\d+[:\s-]*/i);
            if (titleClickupMatch) {
              const cleanTitle = prTitle.replace(/DUPLOAI-\d+[:\s-]*/i, '').trim();
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                title: cleanTitle,
              });
              core.warning(`⚠️ ClickUp ticket ID removed from PR title. New title: "${cleanTitle}"`);
              prTitle = cleanTitle;
            }

            // Title length: 20–72 chars (titles become changelog entries)
            if (prTitle.length < 20) {
              core.setFailed(`❌ PR title too short (${prTitle.length} chars, min 20). Write a descriptive title — it becomes the changelog entry.`);
              return;
            }
            if (prTitle.length > 72) {
              core.setFailed(`❌ PR title too long (${prTitle.length} chars, max 72). Shorten it to keep the changelog readable.`);
              return;
            }

            // ClickUp ID must be in the body (not the title)
            const clickupPattern = /DUPLOAI-\d+/;
            const clickupUrlPattern = /https:\/\/app\.clickup\.com\/t\/\d+\/DUPLOAI-\d+/;
            if (!clickupPattern.test(prBody) && !clickupUrlPattern.test(prBody)) {
              core.setFailed('❌ PR validation failed: ClickUp ticket ID (DUPLOAI-XXXXX) is required in the PR description.\n\nAdd it to the "ClickUp Ticket" section.');
              return;
            }

            // All required sections must be present
            const requiredSections = [
              'ClickUp Ticket',
              'Type',
              'Overview',
              'Summary of changes',
              'Testing performed',
              'Describe any breaking changes',
            ];
            const missingSections = requiredSections.filter(section =>
              !new RegExp(`##\\s*${section}`, 'i').test(prBody)
            );
            if (missingSections.length > 0) {
              core.setFailed(`❌ PR validation failed: Missing required sections:\n${missingSections.map(s => `  - ${s}`).join('\n')}\n\nPlease use the PR template.`);
              return;
            }

            // ClickUp Ticket section must have content
            const clickupSectionMatch = prBody.match(/##\s*ClickUp Ticket[\s\S]*?(?=##|$)/i);
            if (clickupSectionMatch) {
              const clickupSection = clickupSectionMatch[0];
              const contentWithoutComments = clickupSection.replace(/<!--[\s\S]*?-->/g, '').replace(/^##\s*ClickUp Ticket/i, '').trim();
              const hasContent = contentWithoutComments.split('\n').some(line => {
                const trimmed = line.trim();
                if (trimmed.startsWith('**ClickUp Ticket ID:**')) {
                  return trimmed.replace(/^\*\*ClickUp Ticket ID:\*\*/, '').trim().length > 0;
                }
                return trimmed.length > 0;
              });
              if (!hasContent) {
                core.setFailed('❌ PR validation failed: ClickUp Ticket section is empty.\n\nAdd your ClickUp ticket ID or URL.');
                return;
              }
            }

            // Type: exactly one checkbox must be checked
            const typeSection = (prBody.match(/##\s*Type[\s\S]*?(?=##|$)/i) || [''])[0];
            const checkedTypes = [...typeSection.matchAll(/- \[x\] `(enhancement|bug|breaking-change|documentation)`/gi)];
            if (checkedTypes.length === 0) {
              core.setFailed('❌ PR validation failed: No PR type selected in the "Type" section. Check exactly one.');
              return;
            }
            if (checkedTypes.length > 1) {
              core.setFailed('❌ PR validation failed: Multiple types selected in the "Type" section. Check exactly one.');
              return;
            }

            core.info(`✅ PR validation passed. Type: ${checkedTypes[0][1]}, Title length: ${prTitle.length}`);

      - name: Add validation comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const comment = '✅ **PR Validation Passed**\n\nAll required sections are present, ClickUp ticket ID is included, and PR type is selected.';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('PR Validation')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: comment
              });
            }
