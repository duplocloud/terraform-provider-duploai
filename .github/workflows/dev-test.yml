name: Dev Test

on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Full test suite
        run: go test ./... -v -timeout 120s
