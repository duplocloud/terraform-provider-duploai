name: Dev Test

on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Full test suite
        run: CGO_ENABLED=1 go test -race ./... -v -timeout 180s
