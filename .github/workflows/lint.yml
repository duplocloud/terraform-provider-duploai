name: Lint

on:
  pull_request:
  push:
    branches: [develop, main, master]

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned for reproducible CI. v2.12.2 matches the v2-schema .golangci.yml.
          # install-mode: goinstall builds it from source with the toolchain set up
          # above, so its build Go is >= the version targeted in go.mod.
          version: v2.12.2
          install-mode: goinstall
          args: --timeout=5m
