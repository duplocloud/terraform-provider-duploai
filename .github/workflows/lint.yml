name: Lint

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned for reproducible CI. v2.12.2 matches the v2-schema .golangci.yml.
          # install-mode: binary downloads the pre-built release asset, which correctly
          # handles the /v2 module path. goinstall cannot resolve v2.x.x for this module.
          version: v2.12.2
          args: --timeout=5m
