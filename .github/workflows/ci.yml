name: CI

# Run on every PR regardless of base branch so stacked / feature-targeted PRs
# are never left without checks, plus on pushes to long-lived branches.
on:
  pull_request:
  push:
    branches: [develop, master]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./...

      - name: Unit tests
        # -race surfaces data races (e.g. the async waiter in duplosdk runs
        # concurrently). It requires CGO, so enable it explicitly.
        run: CGO_ENABLED=1 go test -race ./... -timeout 120s -parallel 4
