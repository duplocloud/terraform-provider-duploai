name: CI

on:
  pull_request:
    branches: [develop, master, main]
  push:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./...

      - name: Unit tests
        run: go test ./... -timeout 90s -parallel 4
