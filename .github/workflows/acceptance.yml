name: Acceptance Tests

# Runs the provider's acceptance tests (TF_ACC=1) against a matrix of Terraform
# versions — this is the only layer that exercises real plan/apply/refresh/import
# through the provider. Gated on the presence of test-backend secrets so it is a
# no-op on forks and on PRs from contributors without access.
on:
  pull_request:
  push:
    branches: [develop, main, master]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-22.04
    # Skip cleanly when the test backend isn't configured (e.g. forks).
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - "1.0.*"
          - "1.5.*"
          - "1.9.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Acceptance tests
        env:
          TF_ACC: "1"
          DUPLO_HOST: ${{ secrets.DUPLO_TEST_HOST }}
          DUPLO_TOKEN: ${{ secrets.DUPLO_TEST_TOKEN }}
        run: go test ./... -v -timeout 120m
