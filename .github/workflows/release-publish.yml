name: Release Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run tests before publish
        run: go test ./... -timeout 90s

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  publish-release:
    runs-on: ubuntu-22.04
    needs:
      - release
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Publish the release
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // List all releases.
            let releases = await github.rest.repos.listReleases({ owner: context.repo.owner, repo: context.repo.repo });
            console.log(`Found ${releases.data.length} releases:`);

            // Identify the draft release.
            const draftRelease = releases.data.find((r) => r.draft && r.tag_name == '${{ github.ref_name }}');
            if (!draftRelease) {
              const msg = `No draft release found: ${{ github.ref_name }}`;
              console.log(msg);
              core.setFailed(msg);
            }

            // Publish the draft release.
            else {
              console.log(`Found draft release: ${draftRelease.tag_name} (${draftRelease.id})`);
              await github.rest.repos.updateRelease({ owner: context.repo.owner, repo: context.repo.repo,
                                                      release_id: draftRelease.id, draft: false });
              console.log(`Published draft release: ${draftRelease.tag_name} (${draftRelease.id})`);
            }

      - name: Notify Slack
        if: success()
        env:
          VERSION: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RELEASE_URL: https://github.com/duplocloud/terraform-provider-duploai/releases/tag/${{ github.ref_name }}
        run: |
          REGISTRY_VERSION="${VERSION#v}"
          REGISTRY_URL="https://registry.terraform.io/providers/duplocloud/duploai/${REGISTRY_VERSION}"
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{
              \"version\": \"${VERSION}\",
              \"actor\": \"${ACTOR}\",
              \"registry_url\": \"${REGISTRY_URL}\",
              \"release_url\": \"${RELEASE_URL}\"
            }" \
            "${{ secrets.SLACK_WEBHOOK }}"
