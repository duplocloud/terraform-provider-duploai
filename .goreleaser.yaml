version: 2
before:
  hooks:
    - go mod tidy
builds:
  - env: [CGO_ENABLED=0]
    mod_timestamp: "${{.CommitTimestamp}}"
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{{{.Version}}}} -X main.commit={{{{.Commit}}}}"]
    goos: [freebsd, windows, linux, darwin]
    goarch: [amd64, arm64, '386', arm]
    ignore:
      - goos: darwin
        goarch: '386'
    binary: terraform-provider-duploai_{{{{.Version}}}}
archives:
  - format: zip
    name_template: "{{{{.ProjectName}}}}_{{{{.Version}}}}_{{{{.Os}}}}_{{{{.Arch}}}}"
checksum:
  name_template: "{{{{.ProjectName}}}}_{{{{.Version}}}}_SHA256SUMS"
  algorithm: sha256
signs:
  - artifacts: checksum
    args: ["-u", "${{GPG_FINGERPRINT}}", "--output", "${{signature}}", "--detach-sign", "${{artifact}}"]
release: {}
changelog:
  skip: true
